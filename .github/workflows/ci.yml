name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than "latest" so a runner image update cannot silently change the
  # compiler under a green build.
  XCODE_VERSION: "26.6"
  SIMULATOR: "platform=iOS Simulator,name=iPhone 17 Pro"
  IPAD_SIMULATOR: "platform=iOS Simulator,name=iPad Pro 13-inch (M5)"

jobs:
  package:
    name: Package — build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: Packages/SuperTerminalKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/SuperTerminalKit/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        working-directory: Packages/SuperTerminalKit
        run: swift build

      - name: Fail on any warning from project code
        working-directory: Packages/SuperTerminalKit
        run: |
          # Third-party warnings are out of our hands; ours are not. Counting only
          # Sources/ keeps the gate honest instead of green-by-exclusion.
          count=$(swift build 2>&1 | grep -cE "Sources/.*warning:" || true)
          echo "project warnings: $count"
          test "$count" -eq 0

      - name: Test
        working-directory: Packages/SuperTerminalKit
        run: swift test

      - name: The bundled third-party notices match the repository copy
        run: cmp THIRD_PARTY_NOTICES.md App/Resources/Legal/THIRD_PARTY_NOTICES.md
      - name: The RSA patch still reproduces the vendored tree
        run: |
          # A patch that has drifted from the tree is worse than no patch: it applies
          # cleanly and produces a *different* library. This regenerates it and fails if
          # the result differs from what is committed.
          ./scripts/regenerate-niossh-patch.sh
          git diff --exit-code -- patches/niossh-rsa.patch

      - name: Vendored swift-nio-ssh — upstream's own tests
        working-directory: Packages/swift-nio-ssh-rsa
        # The vendored fork is security-critical code we now maintain. Running upstream's
        # suite here is what makes a re-sync verifiable rather than assumed safe.
        run: swift test

  app:
    name: App — build, unit and UI tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: Build (Debug, simulator)
        run: |
          xcodebuild -project SuperTerminal.xcodeproj -scheme SuperTerminal \
            -configuration Debug -destination "$SIMULATOR" build

      - name: Build (Release, unsigned device)
        run: |
          # Proves the arm64 device build compiles. Signing needs a team, which CI does
          # not have, so it is disabled rather than pretended.
          xcodebuild -project SuperTerminal.xcodeproj -scheme SuperTerminal \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: App integration tests (real sshd)
        run: ./scripts/app-integration-e2e.sh "$SIMULATOR"

      - name: Every user-visible string is translated
        # Localization rots silently: a new Text("…") compiles, ships, and shows English to
        # someone who chose Chinese, with nothing failing anywhere. This is what turns that
        # into a red build.
        run: ./scripts/localization-audit.sh "$SIMULATOR"

      - name: UI tests (real sshd, real interface)
        run: ./scripts/ui-terminal-e2e.sh "$SIMULATOR"

      - name: UI tests on iPad
        # The regular-width layout is a different app in the ways that matter. Running
        # these on an iPad found four defects the phone run could not see, so it is a
        # gate rather than an occasional check.
        env:
          ST_RESULT_BUNDLE: .build/ui-terminal-ipad.xcresult
        run: ./scripts/ui-terminal-e2e.sh "$IPAD_SIMULATOR"

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            .build/ui-terminal.xcresult
            .build/ui-terminal-ipad.xcresult
          if-no-files-found: ignore

  hygiene:
    name: Repository hygiene
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: No placeholder implementations
        run: |
          # The project's own rule: nothing ships with a placeholder standing in for real
          # work. Scoped to our source so a dependency's TODO cannot fail the build.
          if grep -rnE "\b(TODO|FIXME)\b|fatalError\(\"not implemented" \
               App/Sources Packages/SuperTerminalKit/Sources \
               --include="*.swift" \
               | grep -v "CBcryptPBKDF"; then
            echo "::error::placeholder implementations found"
            exit 1
          fi

      - name: No committed secrets
        run: |
          # A private key or a Cloudflare token in the history cannot be taken back, so
          # this runs on every change rather than at review time.
          #
          # Matching a *whole line* that is a PEM header is what separates a real key
          # file from the parser that has to know the marker string, and from this file,
          # which has to name the pattern it looks for.
          if git grep -nE '^-{5}BEGIN [A-Z ]*PRIVATE KEY-{5}$' -- . ; then
            echo "::error::a private key appears to be committed"
            exit 1
          fi
          # Cloudflare service token IDs end in `.access`; a real one assigned to a
          # variable is a leak, whereas the variable name alone is not.
          if git grep -nE '=[[:space:]]*"[0-9a-f]{32}\.access"' -- . ; then
            echo "::error::a Cloudflare service token appears to be committed"
            exit 1
          fi
          if git grep -nE '^CF_Authorization=' -- . ; then
            echo "::error::a Cloudflare Access cookie appears to be committed"
            exit 1
          fi
