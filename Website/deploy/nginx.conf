# Apex Terminal — static site, served behind the Cloudflare Tunnel on this host.
#
# App Store Connect requires that the Support URL and the Privacy Policy URL be
# reachable without JavaScript and that they never redirect. try_files therefore
# resolves /privacy to /privacy/index.html directly, with no 301 to /privacy/.

server {
    listen 80;
    server_name _;
    charset utf-8;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/xml text/plain image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;

    # No trailing-slash redirect: serve the index file for a directory URL.
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
